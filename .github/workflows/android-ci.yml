name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Android checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "11076708"
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Check and build
        run: |
          ./gradlew --no-daemon --stacktrace \
            ktlintCheck \
            lintDebug \
            testDebugUnitTest \
            :core:core-domain:test \
            :core:core-vss:test \
            :app:assembleDebug
      - name: Save APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Generate coverage reports
        if: github.event_name != 'pull_request'
        run: |
          ./gradlew --no-daemon \
            :app:koverHtmlReportDebug \
            :app:koverXmlReportDebug
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.sha }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 7
